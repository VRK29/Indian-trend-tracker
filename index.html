<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indian Trend Tracker</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    h1 { text-align: center; color: #38bdf8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
    .price { color: #4ade80; font-weight: bold; }
    .score { color: #facc15; }
  </style>
</head>
<body>
  <h1>🔥 Indian E-Commerce Trend Tracker</h1>
  <div id="products" class="grid">Loading products...</div>

  <script>
    const SUPABASE_URL = "https://oqwgpklnyoyzdaqfkpxb.supabase.co";
    // Replace with your exact Publishable or Anon key from Supabase
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xd2dwa2xueW95emRhcWZrcHhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMzQ0MjUsImV4cCI6MjEwNTgxMDQyNX0.ODPBxUWXeStDtaYj0-Tg5fz4sQUbqw9hUFl_2Z5g6cg"; 

    async function loadProducts() {
      const container = document.getElementById('products');
      try {
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await client.from('trending_products').select('*');
        
        if (error) {
          container.innerHTML = '<p style="color:red;">Database Error: ' + error.message + '</p>';
          return;
        }

        if (!data || data.length === 0) {
          container.innerHTML = '<p>No products found in database.</p>';
          return;
        }

        container.innerHTML = data.map(item => `
          <div class="card">
            <h3>${item.name || 'Unnamed Product'}</h3>
            <p><strong>Platform:</strong> ${item.platform || 'N/A'}</p>
            <p><strong>Category:</strong> ${item.category || 'N/A'}</p>
            <p class="price">₹${item.price || 0}</p>
            <p class="score">Trend Score: ${item.trend_score || 0}/100</p>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p style="color:red;">Script Error: ' + err.message + '</p>';
      }
    }

    window.onload = loadProducts;
  </script>
</body>
</html>
